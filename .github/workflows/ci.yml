name: CI

# Quality checks on every push and pull request, then deployment of the
# frontend to AWS on pushes to master.
#
# The backend is still released manually over SSH (see planning/09-ops-runbook.md).
# Vercel also still auto-deploys the frontend until DNS cutover — the two run in
# parallel on purpose, so Vercel remains a working rollback for a fortnight after
# the switch.
#
# Authentication uses GitHub OIDC: no AWS access keys are stored in this
# repository. See infra/modules/github-oidc for the trust boundary.

on:
  push:
    branches: ["master", "rebuild", "feat/**"]
  pull_request:
    branches: ["master"]

# NOTE: there is deliberately NO workflow-level concurrency block.
#
# Workflow-level `cancel-in-progress` cancels the entire run, deploy jobs
# included. That has two sharp edges we hit in practice:
#
#   1. A production deploy paused for approval is silently cancelled by the next
#      push. You can open the email, click Approve, and be approving a dead run.
#   2. Worse, cancelling mid-rollout stops the WATCHER, not the deployment. ECS
#      carries on regardless; the circuit breaker still rolls back a bad
#      revision, but no job reports it and nobody is watching.
#
# So cancellation lives on the test jobs, where superseding an old run is purely
# a saving, and the deploy jobs queue instead.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    # Superseded test runs are wasted minutes — cancel them.
    concurrency:
      group: test-backend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        # Advisory for now — flip `continue-on-error` to false once the
        # codebase has been formatted once with `./vendor/bin/pint`.
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    concurrency:
      group: test-frontend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs the lockfile exactly and fails loudly on drift, which
      # is what we want gating a deploy. It needs Node 24 / npm 11: the lockfile
      # is npm 11-generated and npm 10 (shipped with Node 22) rejects it with a
      # spurious "out of sync" error. Keep this pin in step with
      # frontend/Dockerfile — CI, Docker and laptops must share one npm major.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Staging first, then production, both only from master and only after the
  # tests and build above have passed.

  deploy-staging:
    name: Deploy → staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never cancelled, and one at a time. A second push waits for this deploy to
    # finish rather than interrupting a rollout half-way through. Not scoped to
    # the ref: there is only ever one staging environment.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      id-token: write   # required to request the OIDC token
      contents: read
    env:
      AWS_REGION: eu-west-1
      REGISTRY: 950177940799.dkr.ecr.eu-west-1.amazonaws.com
      CLUSTER: vitorra-staging
      SERVICE: vitorra-staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::950177940799:role/vitorra-staging-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # NEXT_PUBLIC_* values are compiled into the client bundle at BUILD time,
      # so staging and production are genuinely different images and one can
      # never be promoted to the other.
      #
      # --provenance=false: buildx otherwise attaches an attestation, which
      # makes each push store two images and quietly halves how far back the
      # ECR lifecycle rule lets us roll back.
      - name: Build and push
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          IMAGE="$REGISTRY/vitorra-frontend:${{ github.sha }}"
          docker build \
            --platform linux/amd64 --provenance=false --sbom=false \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_API_URL=https://api.vitorra.org/api \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }} \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging \
            --build-arg SENTRY_ORG=${{ secrets.SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }} \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Tags are immutable SHAs, so a deploy is a NEW task definition revision
      # rather than a restart. Terraform ignores task_definition changes on the
      # service for exactly this reason.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$SERVICE" \
            --query taskDefinition > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ env.IMAGE }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.SERVICE }}
          cluster: ${{ env.CLUSTER }}
          # Fail the run if the new revision never becomes healthy. The service's
          # circuit breaker rolls it back; this makes the failure visible.
          wait-for-service-stability: true

  deploy-production:
    name: Deploy → production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Declaring the environment means you can add required reviewers in GitHub
    # (Settings → Environments → production) to gate production behind human
    # approval. ⚠ Until you do, this deploys automatically.
    environment: production
    # Never cancelled. A deploy waiting for approval stays waiting, so the
    # approval you were emailed about is still the one you are granting.
    # ⚠ Consequence: if two runs both reach here, the second QUEUES behind the
    # first. Approve or reject the older one to release it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-1
      REGISTRY: 574247905057.dkr.ecr.eu-west-1.amazonaws.com
      CLUSTER: vitorra-prod
      SERVICE: vitorra-prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::574247905057:role/vitorra-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          IMAGE="$REGISTRY/vitorra-frontend:${{ github.sha }}"
          docker build \
            --platform linux/amd64 --provenance=false --sbom=false \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_API_URL=https://api.vitorra.org/api \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }} \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=production \
            --build-arg SENTRY_ORG=${{ secrets.SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }} \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$SERVICE" \
            --query taskDefinition > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ env.IMAGE }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.SERVICE }}
          cluster: ${{ env.CLUSTER }}
          wait-for-service-stability: true
