name: CI

# Runs quality checks on every push and pull request.
# No deployment yet: the frontend auto-deploys via Vercel, and the backend is
# released manually over SSH (see PROGRESS.md / the ops runbook). A deploy job
# lands here in Phase 3 of planning/11-aws-migration-plan.md.

on:
  push:
    branches: ["master", "rebuild", "feat/**"]
  pull_request:
    branches: ["master"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        # Advisory for now — flip `continue-on-error` to false once the
        # codebase has been formatted once with `./vendor/bin/pint`.
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs the lockfile exactly and fails loudly on drift, which
      # is what we want gating a deploy. It needs Node 24 / npm 11: the lockfile
      # is npm 11-generated and npm 10 (shipped with Node 22) rejects it with a
      # spurious "out of sync" error. Keep this pin in step with
      # frontend/Dockerfile — CI, Docker and laptops must share one npm major.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
